<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Вход в CoinKeeper</mat-card-title>
      <mat-card-subtitle>Управляйте своими финансами</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Поле Логин -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Логин</mat-label>
          <input
            matInput
            type="text"
            formControlName="login"
            placeholder="Введите логин"
            autocomplete="username"
          />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="login?.hasError('required')">
            Логин обязателен
          </mat-error>
        </mat-form-field>

        <!-- Поле Пароль -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Пароль</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
          />
          <mat-icon matPrefix>lock</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Показать пароль'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="password?.hasError('required')">
            Пароль обязателен
          </mat-error>
        </mat-form-field>

        <!-- Сообщение об ошибке -->
        <div *ngIf="errorMessage" class="error-message">
          <mat-icon>error</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Кнопка входа -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width submit-button"
          [disabled]="loading"
        >
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">Войти</span>
        </button>

        <!-- Ссылка на регистрацию -->
        <div class="register-link">
          <span>Нет аккаунта?</span>
          <a routerLink="/auth/register" mat-button color="accent">
            Зарегистрироваться
          </a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
