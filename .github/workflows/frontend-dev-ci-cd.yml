name: Frontend Dev CI/CD

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alekaz04/coinkeeper/frontend

jobs:
  build-and-publish:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: coinkeeper-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./coinkeeper-frontend
        run: npm ci

      - name: Build Angular application
        working-directory: ./coinkeeper-frontend
        run: npm run build -- --configuration production

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GT_PAT }}

      - name: Build Docker image
        working-directory: ./coinkeeper-frontend
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev .

      - name: Push Docker image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev

      - name: Clean up old images
        run: docker image prune -af

  deploy-to-raspberry:
    runs-on: ubuntu-latest
    needs: build-and-publish
    
    steps:
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RASPBERRY_SSH_HOST }}
          username: ${{ secrets.RASPBERRY_SSH_USERNAME }}
          key: ${{ secrets.RASPBERRY_SSH_KEY }}
          script: |
            cd /home/bl-server/dev/Coinkeeper.Infrastructure
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -af
